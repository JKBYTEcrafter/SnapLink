# Render Blueprint — SnapLink Deployment
# https://render.com/docs/blueprint-spec

services:
  # --- API Web Service ---
  - type: web
    name: snaplink-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    plan: free
    envVars:
      - key: MONGODB_URL
        sync: false   # Set this manually in the Render dashboard to your Atlas URI
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: MACHINE_ID
        value: 1
